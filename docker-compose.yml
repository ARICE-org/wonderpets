  # ML Soil Service (isolated) - DDD Architecture
  ml-soil:
    build:
      context: ./machine_learning
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - ./machine_learning/apps:/code/apps
      - ./machine_learning/trained_models:/code/trained_models
    environment:
      - MODEL_PATH=/code/trained_models
      - PYTHONPATH=/code
    env_file:
      - ./.env
    command: uvicorn apps.soil_service.main:app --host 0.0.0.0 --port 8001

