services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgre:
        condition: service_started
        restart: true
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/code/app
    develop:
      watch:
        - action: sync # live sync files into container
          path: ./backend
          target: /app
        - action: rebuild
          path: requirements.txt # trigger rebuild if deps change
    environment:
      # NOTE: Use Docker service DNS + internal Postgres port.
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgre:5432/${POSTGRES_DB}
      - POSTGRES_HOST=postgre
      - POSTGRES_PORT=5432
      # NOTE: Inside Docker networks, use service DNS, not localhost.
      - SOIL_ML_URL=http://ml-soil:8001
    env_file:
      - ./.env

  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   ports:
  #     - "8081:8081"
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   depends_on:
  #     - backend
  postgre:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgre_data:/var/lib/postgresql/data
      # - ./backend/db/init:/docker-entrypoint-initdb.d

